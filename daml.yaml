# Partner order contracts must not depend on the Tradecraft core.
sdk-version: 3.5.1
name: tradecraft-amm-order-v2
source: src
version: 2.3.0
build-options:
  - --target=2.3
  - -Wupgrade-interfaces
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  # Splice Token Standard 0.8.1 release bundle, versioned DARs.
  # Do not replace these with -current aliases.
  - ../dars/splice-api-token-metadata-v1-1.0.0.dar
  - ../dars/splice-api-token-holding-v1-1.0.0.dar
  - ../dars/splice-api-token-holding-v2-1.0.0.dar
  - ../dars/splice-api-token-allocation-instruction-v2-1.0.0.dar
  - ../dars/splice-api-token-allocation-v2-1.0.0.dar
  - ../dars/splice-api-token-transfer-instruction-v1-1.0.0.dar
  - ../dars/splice-token-standard-utils-2.0.0.dar
